{"name": "BaFin data for Bourse", "on": {"schedule": [{"cron": "7 * * * *"}], "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "jobs": {"bafin": {"runs-on": "ubuntu-latest", "timeout-minutes": 10, "steps": [{"name": "Download BaFin directors dealings (MAR art. 19) and publish them to branch bafin-data", "env": {"GITHUB_TOKEN": "${{ secrets.GITHUB_TOKEN }}"}, "run": "set -e\nU='https://portal.mvp.bafin.de/database/DealingsInfo/sucheForm.do?meldepflichtigerName=&zeitraum=0&d-4000784-e=1&emittentButton=Suche+Emittent&emittentName=&zeitraumVon=&emittentIsin=&6578706f7274=1&zeitraumBis='\ncurl -sS --fail --retry 3 --retry-delay 15 -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/130.0 Safari/537.36' -o bafin.csv \"$U\"\necho bytes $(wc -c < bafin.csv) lines $(wc -l < bafin.csv)\ntest $(wc -c < bafin.csv) -gt 1000\nmkdir out\nmv bafin.csv out/\ncd out\ngit init -q\ngit checkout -q --orphan bafin-data\ngit add bafin.csv\ngit -c user.name=bourse-bot -c user.email=bot@bourse.pl commit -qm data\ngit push -qf https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git bafin-data"}]}}}
